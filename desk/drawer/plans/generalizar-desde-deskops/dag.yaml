    tree_id: T2.7
    title: Espacios de nombres y jerarquía de tags; reemplazo de texto en documentos trackeados
    kind: code
    node_role: delivery
    parent_id: PG2
    owner_repo: sldb
    estimate: M
    depends_on: [GD24]
    requires: [G_WRITE_API]
    go_nodes: {requires: [], coordinates: []}
    scope: '(1) Tags: StoreDeclaration gana tag_namespaces: lista de {name, hierarchical: bool, folder_axis: bool, anchored_by: {model, field} opcional}. Validación al escribir un documento (paso de validación existente, sin tocar payload_save_steps.py: se registra como validador del store): un tag namespace:valor cuyo namespace no está declarado es error si el store declara tag_namespaces (sin la clave, nada cambia); con anchored_by, cada prefijo con punto del valor (la jerarquía de store/semantic_tags.py:35 _prefix_edges) debe tener un documento del modelo anchored_by.model cuyo campo anchored_by.field es ese tag; si falta, error que lista los prefijos faltantes (mecánica de deskops domain_tree.py:80 require_domain_parents, sin sus nombres). Función sldb.api.tag_tree(store, namespace) → {roots: árbol anidado {tag, document, children}, orphans: tags usados sin documento ancla, unplaced: documentos ancla sin uso}; folder_axis: sldb.api.tag_folder(tag) → ruta a/b para a.b (mecánica de atom_tags.py:120). sldb.api.semantic (dag_reads, dag_writes) se reexporta en sldb.api. CLI: sldb tags namespaces, sldb tags tree NAMESPACE, sldb tags check. (2) Reemplazo: sldb.api.replace_text(store, ref, old, new, *, count=1, transaction=None) sobre un documento trackeado o un archivo no modelado bajo la raíz: exige exactamente count apariciones de old (si no, error con el número visto y nada se escribe); en un documento trackeado reescribe los bytes, re-extrae y valida contra el modelo (si no valida, error y nada se escribe) y re-trackea con el mismo modelo y nombre; todo dentro de sldb.api.transaction. CLI sldb docs replace REF --old --new [--count N] con envelope. Doc docs/architecture/tags.md y sección en docs/architecture/transactions.md.'
    acceptance: 'En un store temporal con tag_namespaces [{name: area, hierarchical: true, anchored_by: {model: Anchor, field: tag}}]: escribir un documento con area:a.b sin Anchor de area:a falla nombrando area:a; con los dos Anchor pasa; un tag otro:x falla por namespace no declarado; un store sin tag_namespaces acepta lo mismo que antes (tests existentes verdes); tag_tree devuelve raíz a con hijo a.b, un huérfano y un unplaced del fixture; tag_folder("a.b") = "a/b"; replace_text con count 1 y dos apariciones falla sin escribir; con una aparición reescribe, re-trackea y el documento extrae igual salvo el texto; un reemplazo que rompe el modelo falla y deja el archivo igual (hash); CHANGELOG; docs; nota de cierre a deskops.'
    output_scope: src/sldb/api/stores/store_declaration.py, src/sldb/api/semantic/, src/sldb/api/tags/, src/sldb/api/documents/replace_text.py, src/sldb/api/__init__.py, src/sldb/store/semantic_tags.py, src/sldb/cli/parsers/tags.py, src/sldb/cli/commands/tags.py, src/sldb/cli/parsers/docs*.py, src/sldb/cli/commands/docs*.py, tests/, docs/architecture/tags.md, docs/architecture/transactions.md, CHANGELOG.md
