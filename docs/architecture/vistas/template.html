<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLDB · Knowledge Kernel · Vistas UML</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,400&family=Manrope:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.1/mermaid.min.js"></script>
<style>
  :root{--bg:#0a0a0f;--amber:#d4a574;--bone:#f5f0e8;--bone-dim:rgba(245,240,232,.6);--line:rgba(212,165,116,.25);--card:#12121a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--bone);font-family:'Manrope',sans-serif;}
  header{padding:48px 6% 28px;border-bottom:1px solid var(--line);}
  .brand{font-family:'Fraunces',serif;font-size:20px;}
  .brand span{color:var(--amber);font-style:italic;}
  h1{font-family:'Fraunces',serif;font-weight:300;font-size:34px;margin-top:14px;}
  h1 em{color:var(--amber);}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);margin-top:10px;}
  nav{display:flex;flex-wrap:wrap;gap:8px;padding:18px 6%;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,15,.95);backdrop-filter:blur(8px);z-index:10;}
  nav a{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:7px 14px;transition:.2s;}
  nav a:hover{color:var(--amber);border-color:var(--amber);}
  section{padding:44px 6%;border-bottom:1px solid rgba(245,240,232,.06);}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-bottom:10px;}
  h2{font-family:'Fraunces',serif;font-weight:400;font-size:24px;margin-bottom:8px;}
  .desc{color:var(--bone-dim);font-weight:300;font-size:14px;line-height:1.6;max-width:820px;margin-bottom:22px;}
  .board{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px;overflow-x:auto;}
  .mermaid{display:flex;justify-content:center;min-width:600px;}
  footer{padding:34px 6%;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--bone-dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .sig{font-family:'Fraunces',serif;font-size:14px;color:var(--bone);}
  .sig span{color:var(--amber);font-style:italic;}

  .mermaid .cluster-label foreignObject { overflow: visible !important; }
  .mermaid .cluster-label span,
  .mermaid .cluster-label div {
    background-color: rgba(10, 10, 15, 0.85) !important;
    padding: 4px 10px !important;
    border-radius: 6px;
    box-shadow: 0 0 8px rgba(10, 10, 15, 0.9);
    display: table;
    white-space: nowrap !important;
    width: auto !important;
    max-width: none !important;
    margin: 0 !important;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
  }

  .board { position: relative; }
  .fs-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(18, 18, 26, 0.7);
    border: 1px solid var(--line);
    color: var(--bone-dim);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    transition: 0.2s;
    z-index: 10;
  }
  .fs-btn:hover { color: var(--amber); border-color: var(--amber); background: rgba(18,18,26,.95); }
  .board:fullscreen {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 20px;
  }
  .board:fullscreen .fs-btn { opacity: 0.3; position: fixed; }
  .board:fullscreen .fs-btn:hover { opacity: 1; }
  .board:fullscreen .mermaid { min-width: unset; }

  /* anotaciones (planning-only) */
  body.anno-mode .mermaid g.node:hover,
  body.anno-mode .mermaid g.classGroup:hover,
  body.anno-mode .mermaid g.stateGroup:hover,
  body.anno-mode .mermaid rect.actor:hover {
    filter: drop-shadow(0 0 5px var(--amber));
    cursor: crosshair;
  }
  body.anno-mode .mermaid g.cluster:hover > rect {
    stroke: var(--amber);
    stroke-width: 1.5px;
    cursor: crosshair;
  }
  .anno-marked { filter: drop-shadow(0 0 7px var(--amber)); }
  .anno-popup {
    position: fixed; z-index: 50; width: 300px;
    background: var(--card); border: 1px solid var(--amber); border-radius: 8px;
    padding: 14px; font-size: 12px;
  }
  .anno-popup .who { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--amber); margin-bottom:8px; word-break:break-word; }
  .anno-popup .prev { color:var(--bone-dim); border-left:2px solid var(--line); padding-left:8px; margin-bottom:6px; line-height:1.4; }
  .anno-popup .prev span { display:block; font-family:'JetBrains Mono',monospace; font-size:9px; opacity:.6; }
  .anno-popup textarea { width:100%; min-height:56px; background:var(--bg); color:var(--bone); border:1px solid var(--line); border-radius:6px; padding:8px; font-family:'Manrope',sans-serif; font-size:12px; resize:vertical; }
  .anno-popup .row { display:flex; gap:6px; margin-top:8px; justify-content:flex-end; }
  .anno-popup button { background:var(--bg); color:var(--bone-dim); border:1px solid var(--line); border-radius:5px; padding:5px 10px; font-family:'JetBrains Mono',monospace; font-size:10px; cursor:pointer; }
  .anno-popup button:hover { color:var(--amber); border-color:var(--amber); }
  #anno-btn.on { color:var(--amber); border-color:var(--amber); }
</style>
</head>
<body>

<header>
  <div class="brand">sldb <span>refactor target</span></div>
  <h1>Knowledge Kernel · <em>Vistas UML</em></h1>
  <div class="sub">GENERADO por scripts/generate_vistas_html.py · fuentes: vistas/*.mmd + vistas.yml · no editar a mano · planning-only</div>
</header>

<nav>
{{NAV}}
</nav>

{{SECTIONS}}

<footer>
  <div>SLDB · KNOWLEDGE KERNEL · VISTAS UML</div>
  <div class="sig">planning-only · <span>deskops / sldb</span></div>
</footer>

<script>
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose',
    theme: 'dark',
    themeVariables: {
      primaryColor: '#12121a',
      primaryBorderColor: '#d4a574',
      primaryTextColor: '#f5f0e8',
      lineColor: '#d4a574',
      secondaryColor: '#0a0a0f',
      tertiaryColor: '#12121a',
      fontFamily: 'Manrope, sans-serif',
      clusterBkg: 'rgba(212,165,116,0.05)',
      clusterBorder: 'rgba(212,165,116,0.25)',
      edgeLabelBackground: '#0a0a0f',
      actorBkg: '#12121a',
      actorBorder: '#d4a574',
      actorTextColor: '#f5f0e8',
      signalColor: '#d4a574',
      signalTextColor: '#f5f0e8',
      noteBkgColor: 'rgba(212,165,116,0.12)',
      noteBorderColor: '#d4a574',
      noteTextColor: '#f5f0e8'
    },
    flowchart: { htmlLabels: true, curve: 'basis', subGraphTitleMargin: { top: 0, bottom: 32 } }
  });

  function bindBoards() {
    document.querySelectorAll('.board').forEach(board => {
      if (board.querySelector('.fs-btn')) return;
      let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX, startY;
      const getSvg = () => board.querySelector('svg');

      board.addEventListener('wheel', (e) => {
        if (!document.fullscreenElement) return;
        e.preventDefault();
        const svg = getSvg();
        if (!svg) return;
        scale += e.deltaY * -0.001;
        scale = Math.max(0.3, Math.min(scale, 10));
        svg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      });

      board.addEventListener('mousedown', (e) => {
        if (!document.fullscreenElement) return;
        if (e.target.closest('.fs-btn')) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        board.style.cursor = 'grabbing';
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        board.style.cursor = '';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging || !document.fullscreenElement) return;
        e.preventDefault();
        const svg = getSvg();
        if (!svg) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        svg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      });

      const btn = document.createElement('button');
      btn.className = 'fs-btn';
      btn.title = 'Fullscreen & Zoom';
      btn.innerHTML = '⛶';
      btn.onclick = () => {
        if (!document.fullscreenElement) {
          board.requestFullscreen().catch(err => console.error(err));
        } else {
          document.exitFullscreen();
        }
      };

      board.addEventListener('fullscreenchange', () => {
        const svg = getSvg();
        if (!document.fullscreenElement) {
          scale = 1; translateX = 0; translateY = 0;
          if (svg) svg.style.transform = '';
        } else {
          if (svg) svg.style.transition = 'none';
        }
      });

      board.appendChild(btn);
    });
  }

  /* ---------- anotaciones (planning-only) ---------- */
  let annoMode = false, annoCache = [];
  const ANNO_SEL = 'g.node, g.classGroup, g.stateGroup, rect.actor, g.cluster';

  function annoLabel(el) {
    if (el.matches('g.cluster')) {
      return el.id || (el.querySelector('.cluster-label')?.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    }
    if (el.matches('rect.actor')) {
      const t = el.parentElement.querySelector('text.actor');
      if (t) return t.textContent.replace(/\s+/g, ' ').trim().slice(0, 80);
    }
    const t = el.querySelector('.label, foreignObject, text');
    return (t ? t.textContent : el.textContent).replace(/\s+/g, ' ').trim().slice(0, 80);
  }
  function annoVista(el) { return el.closest('section')?.id || 'unknown'; }

  async function annoLoad() {
    try {
      const r = await fetch('/annotations');
      annoCache = await r.json();
      annoRender();
    } catch { console.warn('annotate_server no activo: python3 scripts/annotate_server.py'); }
  }
  function annoRender() {
    document.querySelectorAll('.anno-marked').forEach(el => el.classList.remove('anno-marked'));
    annoCache.forEach(a => {
      const sec = document.getElementById(a.vista);
      if (!sec) return;
      sec.querySelectorAll(ANNO_SEL).forEach(el => {
        if (annoLabel(el) === a.label) el.classList.add('anno-marked');
      });
    });
  }
  function annoClose() { document.getElementById('anno-popup')?.remove(); }
  function annoPopup(el, x, y) {
    annoClose();
    const vista = annoVista(el), label = annoLabel(el);
    const prev = annoCache.filter(a => a.vista === vista && a.label === label);
    const div = document.createElement('div');
    div.className = 'anno-popup'; div.id = 'anno-popup';
    div.style.left = Math.min(x, innerWidth - 320) + 'px';
    div.style.top = Math.min(y, innerHeight - 240) + 'px';
    div.innerHTML =
      `<div class="who">${vista} · ${label}</div>` +
      prev.map(a => `<div class="prev">“${a.comentario}”<span>${a.ts.slice(0, 10)}</span></div>`).join('') +
      `<textarea placeholder="comentario…"></textarea>
       <div class="row">
         <button data-act="save">guardar</button>
         ${prev.length ? '<button data-act="del">borrar</button>' : ''}
         <button data-act="x">✕</button>
       </div>`;
    div.addEventListener('click', async e => {
      const act = e.target.dataset?.act;
      if (!act) return;
      if (act === 'x') return annoClose();
      if (act === 'del') {
        await fetch('/annotate', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vista, label }) });
        annoClose(); return annoLoad();
      }
      const comentario = div.querySelector('textarea').value.trim();
      if (!comentario) return;
      await fetch('/annotate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ vista, label, comentario }) });
      annoClose(); annoLoad();
    });
    document.body.appendChild(div);
    div.querySelector('textarea').focus();
  }
  function initAnnotations() {
    const btn = document.createElement('a');
    btn.href = '#'; btn.textContent = '✎ marcar'; btn.id = 'anno-btn';
    btn.addEventListener('click', e => {
      e.preventDefault();
      annoMode = !annoMode;
      document.body.classList.toggle('anno-mode', annoMode);
      btn.classList.toggle('on', annoMode);
      if (!annoMode) annoClose();
    });
    document.querySelector('nav').appendChild(btn);
    document.addEventListener('click', e => {
      if (!annoMode || e.target.closest('.anno-popup, #anno-btn')) return;
      const el = e.target.closest(ANNO_SEL);
      if (!el) return;
      e.preventDefault(); e.stopPropagation();
      annoPopup(el, e.clientX, e.clientY);
    }, true);
    annoLoad();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      await document.fonts.ready;
      await mermaid.run({ querySelector: '.mermaid' });
      // subir los títulos de subgraph sobre los nodos (SVG pinta en orden de documento)
      document.querySelectorAll('.mermaid svg').forEach(svg => {
        svg.querySelectorAll('g.cluster-label').forEach(lbl => {
          let t = lbl.getAttribute('transform') || '';
          for (let n = lbl.parentElement; n && n !== svg; n = n.parentElement)
            t = ((n.getAttribute('transform') || '') + ' ' + t).trim();
          lbl.setAttribute('transform', t);
          lbl.style.pointerEvents = 'none';
          svg.appendChild(lbl);
        });
      });
    } catch (err) {
      console.error('mermaid render failed:', err);
    } finally {
      bindBoards();
      initAnnotations();
    }
  });
</script>
</body>
</html>
