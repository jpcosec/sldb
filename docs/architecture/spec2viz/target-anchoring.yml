id: sldb.target.anchoring
title: Knowledge Kernel Anchoring Model
type: component
version: "0.3"
views:
  - d14

data:
  nodes:
    AnchorNode:
      label: Anchor node
      kind: core
      atoms:
        - ast-anchor
      contains:
        - DocumentPath
        - SourceHash
        - StableSelector
        - SampleText
        - Comments
        - AnchorKind

    DocumentPath:
      label: source document path
      kind: core
      atoms:
        - document-path

    SourceHash:
      label: source hash / source fingerprint
      kind: core
      atoms:
        - source-document-hash

    StableSelector:
      label: stable selector
      kind: core
      atoms:
        - stable-selector
      contains:
        - StructuralLocator
        - TextLocator
        - FamilySpecificLocator

    StructuralLocator:
      label: structural / AST locator
      kind: core
      atoms:
        - ast-locator

    TextLocator:
      label: text locator
      kind: core
      atoms:
        - text-locator

    FamilySpecificLocator:
      label: family-specific locator
      kind: boundary
      contains:
        - PDFLocator
        - HTMLLocator
        - CodeLocator

    PDFLocator:
      label: page / XML locator
      kind: boundary
      atoms:
        - page-locator

    HTMLLocator:
      label: DOM / element locator
      kind: boundary
      atoms:
        - dom-locator

    CodeLocator:
      label: syntax / tree-sitter locator
      kind: boundary
      atoms:
        - syntax-locator

    SampleText:
      label: quoted text sample
      kind: core
      atoms:
        - anchor-sample

    Comments:
      label: anchor comments
      kind: core
      atoms:
        - anchor-comment

    AnchorKind:
      label: AST / text / external anchor kind
      kind: core

    ReversibleFamilies:
      label: reversible document families
      kind: boundary
      atoms:
        - reversible-document-family

  edges:
    - from: AnchorNode
      to: DocumentPath
      relation: requires
    - from: AnchorNode
      to: SourceHash
      relation: requires
    - from: AnchorNode
      to: StableSelector
      relation: requires
    - from: AnchorNode
      to: SampleText
      relation: may_include
    - from: AnchorNode
      to: Comments
      relation: may_include
    - from: AnchorNode
      to: AnchorKind
      relation: classifies
    - from: StableSelector
      to: StructuralLocator
      relation: may_use
    - from: StableSelector
      to: TextLocator
      relation: may_use
    - from: StableSelector
      to: FamilySpecificLocator
      relation: may_specialize_to
    - from: AnchorKind
      to: ReversibleFamilies
      relation: prefers
      label: AST-aware anchors where canonical structure exists
