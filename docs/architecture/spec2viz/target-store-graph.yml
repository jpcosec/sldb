id: sldb.target.store_graph
title: Knowledge Kernel Store Graph
type: component
version: "0.3"
views:
  - d04
  - d07
  - d09

data:
  nodes:
    KernelRepository:
      label: Kernel Repository
      kind: database
      atoms:
        - graph-store
      contains:
        - Documents
        - Revisions
        - Transactions
        - Nodes
        - Edges
        - Artifacts
        - TransactionLog
        - ContentStore
        - HeadStore
        - CompatibilityMetadata
        - BackupExports
        - RetentionRoots
        - RebuildableState

    Documents:
      label: documents
      kind: core
      atoms:
        - document

    Revisions:
      label: immutable revisions
      kind: core
      atoms:
        - revision

    Transactions:
      label: committed transactions
      kind: core
      atoms:
        - transaction
      contains:
        - PrimitiveOperations

    PrimitiveOperations:
      label: primitive operations
      kind: core
      atoms:
        - primitive-operation

    Nodes:
      label: canonical nodes
      kind: core
      atoms:
        - node

    Edges:
      label: canonical edges
      kind: core
      contains:
        - OwnershipEdges
        - ReferenceEdges
        - SemanticEdges
        - DerivedEdges

    OwnershipEdges:
      label: ownership edges
      kind: core
      atoms:
        - ownership-edge

    ReferenceEdges:
      label: reference edges
      kind: core
      atoms:
        - reference-edge

    SemanticEdges:
      label: semantic edges
      kind: core
      atoms:
        - semantic-edge

    DerivedEdges:
      label: derived edges
      kind: core
      atoms:
        - derived-edge

    Artifacts:
      label: artifacts / derived payloads
      kind: core
      atoms:
        - artifact

    TransactionLog:
      label: append-only transaction log
      kind: database
      atoms:
        - transaction-log

    ContentStore:
      label: content-addressed store
      kind: database
      atoms:
        - content-addressed-store

    HeadStore:
      label: document heads
      kind: database
      atoms:
        - document-head

    CompatibilityMetadata:
      label: compatibility metadata
      kind: database
      atoms:
        - compatibility-surface

    BackupExports:
      label: backup / export artifacts
      kind: database
      atoms:
        - backup-export

    RetentionRoots:
      label: retention roots / pins
      kind: database
      atoms:
        - retention-policy

    RebuildableState:
      label: rebuildable indexes / caches
      kind: database
      atoms:
        - derived-index
      contains:
        - HashCache
        - SearchIndex
        - SemanticIndex
        - ProjectionCache
        - PetgraphView
        - ObservabilityLog
        - DegradedState

    ObservabilityLog:
      label: observability log / traces
      kind: database

    DegradedState:
      label: degraded-state records
      kind: database

    HashCache:
      label: hash cache
      kind: database
      atoms:
        - cache

    SearchIndex:
      label: lexical search index
      kind: database

    SemanticIndex:
      label: semantic / embedding index (deferred after first slice)
      kind: database

    ProjectionCache:
      label: projection cache
      kind: database

    PetgraphView:
      label: petgraph materialization
      kind: database
      atoms:
        - graph-projection

  edges:
    - from: KernelRepository
      to: Documents
      relation: persists
    - from: KernelRepository
      to: Revisions
      relation: persists
    - from: KernelRepository
      to: Transactions
      relation: persists
    - from: KernelRepository
      to: Nodes
      relation: persists
    - from: KernelRepository
      to: Edges
      relation: persists
    - from: KernelRepository
      to: Artifacts
      relation: persists
    - from: KernelRepository
      to: TransactionLog
      relation: treats_as_source_of_truth
    - from: KernelRepository
      to: ContentStore
      relation: treats_as_source_of_truth
    - from: KernelRepository
      to: HeadStore
      relation: updates
    - from: KernelRepository
      to: CompatibilityMetadata
      relation: version_tracks
    - from: KernelRepository
      to: BackupExports
      relation: exports_to
    - from: KernelRepository
      to: RetentionRoots
      relation: protects_with
    - from: Transactions
      to: PrimitiveOperations
      relation: contains
    - from: Revisions
      to: Transactions
      relation: produced_by
    - from: Revisions
      to: Nodes
      relation: materializes
    - from: Revisions
      to: Edges
      relation: materializes
    - from: Nodes
      to: Artifacts
      relation: may_attach
    - from: Revisions
      to: RetentionRoots
      relation: may_be_pinned_by
    - from: OwnershipEdges
      to: Nodes
      relation: structures
      label: participates in Merkle recursion
    - from: ReferenceEdges
      to: Nodes
      relation: references
      label: excluded from structural recursion
    - from: SemanticEdges
      to: Nodes
      relation: relates
      label: derived meaning
    - from: DerivedEdges
      to: Artifacts
      relation: links_to
      label: derived lineage
    - from: CompatibilityMetadata
      to: Transactions
      relation: versions_semantics_for
    - from: CompatibilityMetadata
      to: Revisions
      relation: versions_format_for
    - from: BackupExports
      to: TransactionLog
      relation: packages
    - from: BackupExports
      to: ContentStore
      relation: packages
    - from: RetentionRoots
      to: Revisions
      relation: keeps_reachable
    - from: RetentionRoots
      to: Artifacts
      relation: may_pin
    - from: RebuildableState
      to: ObservabilityLog
      relation: records
    - from: RebuildableState
      to: DegradedState
      relation: records
    - from: KernelRepository
      to: RebuildableState
      relation: rebuilds
