9dica, que tiene vigencia de 90 d\xEDas. Si tu receta vence, puedes renovarla en una teleconsulta del programa, disponible de lunes a domingo de 8:00 a 22:00, sin costo para pacientes inscritos. El m\xE9dico de la teleconsulta emite una receta electr\xF3nica v\xE1lida en todo Chile.","Red de atenci\xF3n en temporada de verano: adem\xE1s de las farmacias adheridas en Santiago, el programa cuenta con puntos en la costa y el sur. En Puc\xF3n, Farmacia del Lago (O'Higgins 480) atiende todos los d\xEDas de 9:00 a 21:00 y tiene stock de Levira. En Villarrica, el Centro M\xE9dico Villarrica Sur ofrece consultas presenciales con m\xE9dicos del programa los d\xEDas h\xE1biles. En La Serena, Farmacia Avenida del Mar atiende de lunes a s\xE1bado.","Guarda Levira refrigerado entre 2 y 8 \xB0C antes de abrirlo. Una vez en uso, el l\xE1piz puede mantenerse a temperatura ambiente hasta por 30 d\xEDas. Si viajas, ll\xE9valo en tu equipaje de mano y nunca en la bodega del avi\xF3n.","Los efectos m\xE1s frecuentes son n\xE1useas, diarrea y disminuci\xF3n del apetito, que suelen bajar con las semanas. Si olvidas una dosis, no dupliques la siguiente y consulta a tu m\xE9dico o al programa.","Para reclamos o sugerencias, escribe a contacto@leviracontigo.cl. Programa sin costo para pacientes con receta vigente de Levira.","Hola, me llamo Carolina y estoy inscrita en el programa hace ocho meses. Mi doctora de cabecera es la Dra. Fuentes en Providencia, pero estoy de vacaciones en Puc\xF3n hasta el 20 de febrero y ella anda fuera del pa\xEDs.","Me di cuenta de que mi receta venci\xF3 la semana pasada y me queda solo un l\xE1piz, que alcanza para la dosis de este domingo. Despu\xE9s no tengo c\xF3mo comprar m\xE1s.","\xBFHay alg\xFAn lugar cerca de Puc\xF3n donde me puedan hacer una receta nueva y comprar Levira? Ah, y el l\xE1piz lo tengo en el refri de la caba\xF1a, \xBFest\xE1 bien as\xED? Gracias."],tu=e=>Hn.find(t=>t.paras.includes(e)).id,op=[{id:"p1",type:"regla",text:"Responder solo con el folleto y el directorio de la red",tags:["Asistente"],anchor:[0,"Respondes consultas de pacientes inscritos usando solo la informaci\xF3n del folleto del programa y del directorio de la red"],conf:.94,status:"confirmado"},{id:"p2",type:"regla",text:"Nunca sugerir obtener Levira sin receta vigente",tags:["Asistente"],anchor:[1,"Nunca sugieras formas de obtener Levira sin receta vigente"],conf:.97,status:"confirmado"},{id:"p3",type:"regla",text:"No indicar dosis ni qu\xE9 hacer con dosis olvidadas",tags:["Asistente"],anchor:[1,"ni indiques dosis, cambios de dosis o qu\xE9 hacer con una dosis olvidada"],conf:.9,status:"confirmado"},{id:"p4",type:"regla",text:"Dolor abdominal intenso, v\xF3mitos o alergia: derivar a urgencia",tags:["Asistente"],anchor:[1,"Si el paciente describe dolor abdominal intenso, v\xF3mitos persistentes o signos de reacci\xF3n al\xE9rgica, ind\xEDcale acudir a un servicio de urgencia"],conf:.92,status:"propuesto"},{id:"p5",type:"regla",text:"Sin acceso a su m\xE9dico: ofrecer teleconsulta y luego centros cercanos",tags:["Asistente"],anchor:[2,"Cuando el paciente no pueda ver a su m\xE9dico, ofrece primero la teleconsulta del programa y luego los centros de la red m\xE1s cercanos a su ubicaci\xF3n"],conf:.88,status:"confirmado"},{id:"p6",type:"regla",text:"No compartir datos de otros pacientes",tags:["Asistente"],anchor:[2,"No compartas datos de otros pacientes"],conf:.96,status:"propuesto"},{id:"p7",type:"regla",text:"Tono cercano, menos de 150 palabras, cerrar ofreciendo ayuda",tags:["Asistente"],anchor:[2,"Responde en un tono cercano, en menos de 150 palabras, y cierra preguntando si necesita algo m\xE1s"],conf:.85,status:"propuesto"},{id:"f1",type:"criterio",text:"Beneficios: recordatorios, material educativo y 30 % de descuento",tags:["Beneficios"],anchor:[3,"recibes recordatorios de dosis, material educativo sobre alimentaci\xF3n y actividad f\xEDsica, y un descuento de 30 % en farmacias adheridas"],conf:.87,status:"propuesto"},{id:"f
