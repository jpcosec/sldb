id: component.sldb-principios-ejemplo
title: El ejemplo del precio, adentro y afuera
type: component
version: "0.2"

data:
  nodes:
    Afuera:
      label: Afuera (los archivos del proyecto)
      kind: boundary
      contains:
        - Documento
        - Codigo
    Documento:
      label: Documento de diseño
      kind: core
      contains:
        - Parrafo
    Parrafo:
      label: "Párrafo: el precio incluye el impuesto"
      kind: core
    Codigo:
      label: Archivo de código
      kind: core
      contains:
        - Funcion
    Funcion:
      label: Función que calcula el precio
      kind: core
    Adentro:
      label: Adentro (nodos y relaciones)
      kind: boundary
      contains:
        - NodoParrafo
        - NodoFuncion
    NodoParrafo:
      label: "Nodo de anclaje del párrafo: dónde estaba y qué se vio"
      kind: core
    NodoFuncion:
      label: "Nodo de anclaje de la función: dónde estaba y qué se vio"
      kind: core

  edges:
    - from: NodoParrafo
      to: NodoFuncion
      label: se apoya en
    - from: NodoParrafo
      to: Parrafo
      label: sensor
    - from: NodoFuncion
      to: Funcion
      label: sensor
