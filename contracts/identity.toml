# Contrato de identidad
#
# Qué es este repositorio, en términos que permitan rechazar.
# `tools/check_identity.py` lo verifica.
#
# Existe porque el diagnóstico de S5 no pudo decidir si varios directorios
# pertenecían. Faltaba la frontera: el repositorio es dos cosas, y sin nombrar
# las dos, la mitad de su contenido parece acumulación.

statement = """
Un sistema para representar cualquier cosa con estructura derivable de forma
determinista —documentos, código, interfaces de programa— como documentos
direccionables, consultables, anclados a su origen y reversibles a su superficie.

Markdown es la superficie autorada: la que un humano escribe. Los árboles
sintácticos de código son la superficie derivada: la que una máquina extrae. El
núcleo no distingue entre las dos, y esa indistinción es el producto.
"""

# Por qué no dice «biblioteca de Markdown», que es lo que decía antes:
#
# 1.368 de los 1.551 documentos del almacén no vienen de Markdown. Vienen de
# `ast.parse()` sobre Python (1.279) y de introspección de argparse (89).
#
# `core/ir/` separa `MeaningNode` de `SurfaceNode`; `BaseASTHandler` es abstracto
# y Markdown es una implementación; y la propia taxonomía del sistema pone
# `source.code` y `source.document` como ramas paralelas.
#
# El razonamiento completo, con la evidencia, en propuesta/03-QUE-ES-REALMENTE.md.

[surfaces]
authored = ["markdown"]
derived = ["python-ast", "argparse", "click"]
note = """
`MarkdownASTHandler` es la única implementación concreta de `BaseASTHandler` tras
317 commits. La abstracción está ejercitada por tres adaptadores derivados, pero
nunca por una segunda superficie autorada: es una capacidad declarada y no
verificada.
"""

# ---------------------------------------------------------------------------
# Grupo 1 · el producto
#
# Genérico. No sabe que este repositorio existe. Es lo que se instala.
# ---------------------------------------------------------------------------

[product]
packages = ["core", "runtime", "store", "api", "selfdoc", "models", "cli", "code"]
rule = """
Ningún paquete de acá puede nombrar nada específico de este repositorio: ni un
modelo de autoaplicación, ni una ruta del árbol, ni un documento del almacén
propio. Si lo hace, el producto deja de ser instalable por otro y pasa a
describir su propia casa.
"""

# `models` y `cli` son producto, y la historia de esta entrada vale registrarla.
#
# Primero los declaré producto. La puerta los rechazó con 18 violaciones porque
# seis modelos parecían ser de autoaplicación. Los reclasifiqué como mezclados.
#
# Era la conclusión equivocada a partir de evidencia correcta: los seis modelos
# NO nombran este repositorio. `PythonSymbolDoc` describe cualquier símbolo de
# Python; `CliCommandDoc`, cualquier interfaz de argparse o click. Son
# adaptadores de superficie derivada, tan producto como `MarkdownASTHandler`.
#
# Lo que me confundió: los únicos documentos que existen hechos con esos modelos
# describen este repositorio. Pero eso es una propiedad del contenido del
# almacén, no de los contratos. Confundí el modelo con su única instancia.

[product.models]
base = ["structured_doc", "provenance", "provenance_block"]
relations = ["relation_doc", "relation_type_doc", "builtin_relation_types"]
derived_surfaces = ["python_symbol_doc", "cli_command_doc", "surface_doc"]
vocabulary = ["knowledge_tag", "anchor_doc", "knowledge_surface", "code_anchor_doc", "code_ref", "anchor_state"]

# ---------------------------------------------------------------------------
# Grupo 2 · la autoaplicación
#
# El repositorio usándose a sí mismo. 1.551 documentos, 77% del código descrito.
# No es andamiaje ni demostración: es la instancia mayor que existe del producto,
# y por eso vive versionada.
# ---------------------------------------------------------------------------

# `selfdoc` figura en [product] y no acá, corrigiendo la clasificación anterior.
#
# Sus seis modelos no nombran este repositorio: `PythonSymbolDoc` describe
# cualquier símbolo de Python, `CliCommandDoc` cualquier interfaz de argparse o
# click. Son adaptadores de dominio, no autoaplicación.
#
# Lo específico de este repositorio es el CONTENIDO del almacén, no los modelos
# que lo estructuran. Esa es la frontera correcta, y la anterior confundía el
# contrato con su instancia.

[self_application]
packages = []
models = []
directories = [".sldb", "knowledge", "desk", "ledger", "runs", "contracts"]
name_collision = """
`knowledge/` acá es la salida de `selfdoc` sobre este repositorio: 1.368
documentos con `system: sldb` en su frontmatter. No tiene relación con el
proyecto `knowledge` que el README declaraba como sucesor, más allá del nombre.

La coincidencia es desafortunada y vale dejarla dicha: al leer «knowledge» en
este árbol hay que saber de cuál se habla. Renombrarlo a `derived/` o
`selfdoc-out/` eliminaría la ambigüedad.
"""
rule = """
Contenido, no código: los documentos que describen este repositorio en concreto.
Ningún paquete del producto puede nombrar una ruta ni un documento de acá.
"""

[self_application.evidence]
documents = 1551
symbols_described = 1279
symbols_total = 1665
commands_described = 68
models_registered = 23

# ---------------------------------------------------------------------------
# Grupo 3 · ajeno
#
# Vive acá y no pertenece a ninguno de los dos grupos. Declararlo es suficiente:
# un directorio prestado y declarado es honesto, uno sin declarar hace que la
# identidad del sistema sea indecidible.
# ---------------------------------------------------------------------------

[[foreign]]
path = "surface"
files = 140
what = "aplicación web propia (`@sldb/surface`, Vite)"
verdict = "no declarada en ninguna especificación; ni producto ni autoaplicación"

[[foreign]]
path = "sldb"
files = 16
what = "los RelationTypeDoc trackeados del store (`sldb/relation_types/`), los que `edges init` escribe"
verdict = "datos del store, no código; estaban partidos entre `kgdb/relation_types/` y este directorio hasta 2026-10-18"

# ---------------------------------------------------------------------------
# Lo que la identidad rechaza
#
# Una identidad que no rechaza nada no es identidad. Estas cuatro no son
# todas mecanizables, y se marca cuáles sí.
# ---------------------------------------------------------------------------

[[rejects]]
rule = "una función del producto que el propio repositorio no use"
mechanized = false
note = "exige juicio: decidir si una función es autoaplicable no es automatizable"

[[rejects]]
rule = "documentación escrita a mano sobre algo que `selfdoc` deriva"
mechanized = false
note = "parcialmente cubierto por tools/check_claims.py, que detecta cuando miente"

[[rejects]]
rule = "un modelo de autoaplicación importado desde un paquete del producto"
mechanized = true
note = "tools/check_identity.py — aplica a core, runtime, store y api; en models y cli la frontera corre por dentro y solo se cuenta la deuda"

[[rejects]]
rule = "un directorio de primer nivel versionado y sin clasificar en este archivo"
mechanized = true
note = "tools/check_identity.py"

# ---------------------------------------------------------------------------
# El congelamiento: resuelto
#
# Una nota del README declaraba este repositorio congelado el 2026-09-07 y
# superseded por `knowledge`. El historial dice otra cosa, y se decidió dejar de
# tratarlo como una tensión abierta: no ocurrió.
#
# La evidencia:
#   223 commits después de la fecha
#   897 cambios de archivo bajo src/
#   subsistemas nuevos: serve, graph, hashing merkle, merge de documentos
#   `knowledge` se congeló el mismo día — su propio commit final dice que el
#   evaluador y la base se movieron a otro proyecto
#   ese otro proyecto está activo y NO importa sldb
#
# El relevo nunca ocurrió. El sucesor murió antes que el antecesor, así que esto
# no es un proyecto congelado con trabajo residual: es el proyecto vigente.
# ---------------------------------------------------------------------------

[status]
state = "activo"
resolved = "2026-10-03"
former_claim = "congelado 2026-09-07, superseded por knowledge"
commits_after_claim = 223
src_changes_after_claim = 897
successor_state = "congelado el mismo día; evaluador movido a otro proyecto que no usa sldb"
tag_preserved = "v1-frozen marca el estado de septiembre"
note = """
Importa porque la identidad era indecidible mientras la contradicción siguiera en
pie: no se podía responder «¿este cambio corresponde?» en un repositorio que se
declaraba cerrado y recibía subsistemas nuevos.

Con esto, la única pregunta de identidad que queda abierta es la de la superficie
autorada, que es un asunto de diseño y no una contradicción.
"""

[freeze]
status = "resuelto: no ocurrió"

